.mw .shell{max-width:1180px;margin:0 auto}
.mw .wrap>*{min-width:0}
@media(min-width:901px){ .mw .chat{position:sticky;top:22px} }

/* ---------- header ---------- */
.mw .head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;
  padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.mw .titles{display:flex;flex-direction:column;align-items:flex-start}
.mw .eyebrow{display:inline-block;background:var(--brand-soft);color:var(--brand);
  font-size:12px;font-weight:600;letter-spacing:.02em;padding:5px 13px;border-radius:99px;margin-bottom:9px}
.mw h1{font-family:Rubik,Heebo,sans-serif;font-size:42px;font-weight:700;margin:0;
  letter-spacing:-.035em;line-height:1.05;position:relative;padding-bottom:9px}
.mw h1 em{font-style:normal;color:var(--brand)}
.mw h1::after{content:"";position:absolute;bottom:0;inset-inline-start:0;width:52px;height:4px;
  border-radius:99px;background:linear-gradient(90deg,var(--coral),#eaa23c)}
.mw .sub{color:var(--mute);font-size:15px;margin:9px 0 0;line-height:1.6}
.mw .brand{display:flex;align-items:center;gap:18px}
.mw .uni{height:34px;width:auto;display:block}
.mw .rule{width:1px;height:34px;background:var(--line);flex:none}
.mw .lockup{height:50px;width:auto;display:block}

/* ---------- notices ---------- */
.mw .pilot{background:var(--coral-soft);border:1px solid #f4d5c8;border-radius:var(--r);
  padding:15px 18px;margin-bottom:12px;font-size:14px;line-height:1.65}
.mw .pilot b{display:block;font-family:Rubik,Heebo,sans-serif;font-weight:600;font-size:15.5px;margin-bottom:4px;color:#9c3c1c}
.mw .pilot p{margin:0}
.mw .pilot button{background:none;border:none;padding:0;margin-top:8px;color:var(--coral);
  font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.mw .terms{margin-top:12px;padding-top:12px;border-top:1px solid #f4d5c8;font-size:12.5px;line-height:1.7;
  color:#7a5342;white-space:pre-wrap}

.mw .dates{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:var(--r);
  margin-bottom:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
  font-size:15px;line-height:1.5}
.mw .dates .tag{flex:none;font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;letter-spacing:.01em}
.mw .dates.open .tag{background:var(--ok-soft);color:var(--ok)}
.mw .dates.before .tag{background:var(--warn-soft);color:var(--warn)}
.mw .dates.closed .tag{background:#eef0f4;color:var(--mute)}
.mw .dates.closed{color:var(--mute)}

/* ---------- layout ---------- */
.mw .wrap{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start}
.mw .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.mw .chat{display:flex;flex-direction:column;height:clamp(430px,calc(100dvh - 130px),840px);
  max-height:calc(100dvh - 40px);overflow:hidden}

/* ---------- messages ---------- */
.mw .stream{flex:1;overflow-y:auto;padding:22px;scroll-behavior:smooth}
.mw .stream::-webkit-scrollbar{width:9px}
.mw .stream::-webkit-scrollbar-thumb{background:#dfe3ea;border-radius:99px}
.mw .row{margin-bottom:14px;display:flex}
.mw .row.me{justify-content:flex-end}
.mw .bub{max-width:80%;padding:13px 17px;font-size:15px;line-height:1.75;white-space:pre-wrap;
  border-radius:18px 18px 18px 6px}
.mw .bub strong{font-weight:700}
.mw .bot{background:var(--brand-soft);color:var(--ink)}
.mw .me .bub{background:var(--brand);color:#fff;border-radius:18px 18px 6px 18px}
.mw .src{display:block;margin-top:9px;font-size:12px;color:var(--mute);opacity:.9}
.mw .typing{color:var(--mute);font-size:14px;padding:0 22px 14px}

/* ---------- composer ---------- */
.mw .bar{border-top:1px solid var(--line);padding:14px;display:flex;gap:10px;background:#fcfdfe}
.mw textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  font:inherit;font-size:15px;height:48px;outline:none;background:#fff;transition:border-color .15s,box-shadow .15s}
.mw textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,95,168,.12)}
.mw button{font:inherit;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s,transform .1s,box-shadow .15s}
.mw button:active{transform:translateY(1px)}
.mw .send{background:var(--brand);color:#fff;padding:0 24px;font-weight:600;border-radius:12px}
.mw .send:hover{background:var(--brand-dark)}
.mw .send:disabled{background:#c3cad6;cursor:default;transform:none}

/* ---------- suggested questions ---------- */
.mw .chips{padding:0 22px 16px;display:flex;flex-wrap:wrap;gap:8px}
.mw .chip{background:#fff;border:1px solid var(--line);color:var(--ink);padding:8px 15px;
  font-size:13.5px;border-radius:99px}
.mw .chip:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);transform:translateY(-1px)}

/* ---------- sidebar ---------- */
.mw .pane{padding:20px;margin-bottom:16px}
.mw .pane h2{font-family:Rubik,Heebo,sans-serif;font-size:16px;font-weight:600;margin:0 0 12px}
.mw .handoff{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.mw .guard{margin:0 22px 14px;background:var(--warn-soft);border:1px solid #f0e0c0;border-radius:12px;
  padding:11px 14px;font-size:13px;line-height:1.6;color:#7a5a1e}
.mw .guard b{font-weight:600}
.mw .hint{font-size:12.5px;color:var(--mute);line-height:1.6;margin:0 0 10px}
.mw .q{font-size:13px;font-weight:500;margin:14px 0 6px}
.mw select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;font:inherit;
  font-size:13px;background:#fff;outline:none;cursor:pointer}
.mw select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,95,168,.12)}
.mw .courses{width:100%;height:104px;resize:vertical;border:1px solid var(--line);border-radius:10px;
  padding:11px;font:inherit;font-size:13px;line-height:1.7;outline:none}
.mw .courses:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,95,168,.12)}
.mw .courses::placeholder{color:#a8b0bd}
.mw .run{width:100%;margin-top:16px;background:var(--ink);color:#fff;padding:11px;font-weight:600;border-radius:11px}
.mw .run:hover{background:#101733}
.mw .run:disabled{background:#c3cad6;cursor:default;transform:none}

.mw .res{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.mw .item{display:flex;gap:10px;font-size:13px;line-height:1.6;margin-bottom:10px;padding:9px 11px;border-radius:10px}
.mw .item.ok{background:var(--ok-soft)} .mw .item.warn{background:var(--warn-soft)} .mw .item.stop{background:var(--stop-soft)}
.mw .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.mw .ok .dot{background:var(--ok)} .mw .warn .dot{background:var(--warn)} .mw .stop .dot{background:var(--stop)}
.mw .item b{font-weight:600}
.mw .ask{width:100%;margin-top:8px;background:#fff;border:1px solid var(--brand);color:var(--brand);
  padding:10px;font-size:13px;font-weight:500;border-radius:11px}
.mw .ask:hover{background:var(--brand-soft)}

.mw .link-btn{display:block;text-align:center;background:var(--brand);color:#fff;text-decoration:none;
  padding:11px;border-radius:11px;font-size:14px;font-weight:600;transition:background .15s}
.mw .link-btn:hover{background:var(--brand-dark)}
.mw .doclinks{display:flex;flex-direction:column;gap:9px}
.mw .doclink{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);
  border-radius:11px;padding:11px 13px;font-size:13.5px;font-weight:500;line-height:1.5;transition:border-color .15s,background .15s}
.mw .doclink:hover{border-color:var(--brand);background:var(--brand-soft)}
.mw .doclink span{display:block;color:var(--mute);font-size:12px;font-weight:400;margin-top:3px}

.mw .contact{font-size:13.5px;line-height:1.9;color:var(--mute);margin:0}
.mw .contact a{color:var(--brand);font-weight:500}
.mw .note{font-size:12px;color:var(--mute);line-height:1.6;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.mw .foot{margin-top:18px;font-size:12px;color:var(--mute);line-height:1.6;text-align:center}
.mw .credit{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--mute);font-size:12px;line-height:1.5}
.mw .credit img{width:28px;height:28px;flex:none}
.mw .ts:not(:empty){padding:0 14px 14px}

/* ---------- small screens ---------- */
@media(max-width:900px){
  .mw{padding:14px 12px}
  .mw .wrap{grid-template-columns:1fr;gap:16px}
  .mw .chat{height:clamp(340px,60dvh,580px)}
  .mw .head{flex-direction:column;align-items:flex-start;gap:14px;padding-bottom:14px;margin-bottom:16px}
  .mw h1{font-size:32px;padding-bottom:8px}
  .mw h1::after{width:44px;height:3px}
  .mw .eyebrow{font-size:11.5px;padding:4px 11px;margin-bottom:7px}
  .mw .sub{font-size:13.5px;margin-top:8px}
  .mw .lockup{height:36px} .mw .uni{height:25px} .mw .brand{gap:13px}
  .mw .stream{padding:16px}
  .mw .bub{max-width:90%;font-size:15px}
  .mw .chips{padding:0 16px 14px}
  .mw textarea{font-size:16px}
  .mw .dates{font-size:14px;align-items:flex-start;gap:10px;padding:13px 15px}
  .mw .pane{padding:16px}
}
@media(max-width:420px){
  .mw .dates{flex-direction:column}
  .mw .chip{font-size:12.5px;padding:7px 13px}
}
